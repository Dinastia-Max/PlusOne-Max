# Blueprint для Background Worker уведомлений.
# API (plusone-api) и мини-приложение настроены в Render отдельно, здесь их нет.
services:
  - type: worker
    name: plusone-notification-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.notification_worker
    plan: starter
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MAX_BOT_TOKEN
        sync: false
      - key: NOTIFICATION_POLL_INTERVAL_SECONDS
        value: "10"
      - key: NOTIFICATION_BATCH_SIZE
        value: "50"
      - key: NOTIFICATION_MAX_ATTEMPTS
        value: "5"
      - key: NOTIFICATION_LOCK_TIMEOUT_SECONDS
        value: "300"
      - key: NOTIFICATION_RETRY_DELAY_SECONDS
        value: "60"
      - key: NOTIFICATION_STATS_INTERVAL_SECONDS
        value: "60"
